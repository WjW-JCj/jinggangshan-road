<style>
/* =========================================================
   星星之火 · 井冈山道路
   ========================================================= */
:root {
  --ink: #EFE4D0;
  --ink-2: rgba(239, 228, 208, .74);
  --ink-3: rgba(239, 228, 208, .42);
  --gold: #D8AF6E;
  --gold-soft: rgba(216, 175, 110, .55);
  --red: #D8452F;
  --red-l: #FF7A55;
  --bg: #05080A;
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --sans: "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --ease: cubic-bezier(.4, 0, .2, 1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; margin: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* ---------- 画布 ---------- */
#stage {
  position: fixed;
  inset: 0;
  opacity: 1;
  transition: opacity 1.1s var(--ease), transform 1.4s var(--ease);
}
body.has-cover #stage { opacity: 0; transform: scale(1.04); }
body.has-cover.entered #stage { opacity: 1; transform: scale(1); }

#cv {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
}
#cv.pointing { cursor: pointer; }
#cv.dragging { cursor: grabbing; }

/* ---------- 页眉 ---------- */
.masthead {
  position: fixed;
  left: clamp(20px, 3.6vw, 56px);
  top: clamp(18px, 3.4vh, 40px);
  z-index: 8;
  pointer-events: none;
  transition: opacity .5s var(--ease);
}
.masthead .zh {
  font-family: var(--serif);
  font-weight: 700;
  font-size: clamp(19px, 1.85vw, 27px);
  letter-spacing: .16em;
  line-height: 1;
  color: var(--ink);
}
.masthead .zh em { font-style: normal; color: var(--red); }
.masthead .en {
  margin-top: 9px;
  font-size: 9px;
  letter-spacing: .34em;
  text-transform: uppercase;
  color: rgba(216, 175, 110, .5);
}
.masthead .rule {
  margin-top: 11px;
  width: 44px;
  height: 1px;
  background: linear-gradient(90deg, var(--gold), transparent);
}

.credit {
  position: fixed;
  right: clamp(20px, 3.6vw, 56px);
  top: clamp(20px, 3.4vh, 40px);
  font-size: 9px;
  letter-spacing: .16em;
  color: rgba(239, 228, 208, .22);
  z-index: 8;
  text-align: right;
  line-height: 1.7;
  pointer-events: none;
  transition: opacity .5s var(--ease);
}

/* ---------- 章节文本 ---------- */
.chap {
  position: fixed;
  left: clamp(20px, 3.6vw, 56px);
  top: 50%;
  transform: translateY(-46%);
  width: min(388px, 33vw);
  z-index: 7;
  pointer-events: none;
  opacity: 0;
  transition: opacity .55s ease, transform .55s ease;
}
.chap.in { opacity: 1; }
.chap-kicker {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 9.5px;
  letter-spacing: .3em;
  color: rgba(216, 175, 110, .82);
  margin-bottom: 20px;
}
.chap-kicker i { display: block; width: 18px; height: 1px; background: var(--gold); opacity: .8; }
.chap h1 {
  font-family: var(--serif);
  font-weight: 700;
  margin: 0 0 14px;
  font-size: clamp(26px, 2.9vw, 40px);
  line-height: 1.16;
  letter-spacing: .05em;
  text-shadow: 0 2px 30px rgba(0, 0, 0, .9);
}
.chap h1 .num {
  display: block;
  font-family: var(--sans);
  font-weight: 300;
  font-size: 10.5px;
  letter-spacing: .34em;
  color: rgba(216, 175, 110, .72);
  margin-bottom: 10px;
}
.chap p {
  margin: 0;
  font-size: clamp(12.5px, 1.03vw, 14.5px);
  line-height: 2.05;
  letter-spacing: .035em;
  color: var(--ink-2);
  font-weight: 300;
  text-shadow: 0 2px 22px rgba(0, 0, 0, .95);
}
.chap .chap-data {
  margin-top: 14px;
  font-size: 10px;
  letter-spacing: .14em;
  color: rgba(216, 175, 110, .62);
  font-variant-numeric: tabular-nums;
}
.chap .chap-key {
  margin-top: 12px;
  display: inline-block;
  border: 1px solid rgba(216, 175, 110, .28);
  padding: 5px 11px 5px 12px;
  font-size: 10px;
  letter-spacing: .2em;
  color: rgba(216, 175, 110, .9);
  background: rgba(216, 175, 110, .05);
}

/* ---------- 底部 HUD ---------- */
.hud {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 9;
  padding: 0 clamp(20px, 3.6vw, 56px) clamp(18px, 3.2vh, 34px);
  display: flex;
  align-items: flex-end;
  gap: clamp(14px, 2.2vw, 30px);
  pointer-events: none;
  transition: opacity .5s var(--ease), transform .5s var(--ease);
}

.tl {
  flex: 1 1 auto;
  position: relative;
  padding: 16px 0 6px;
  pointer-events: auto;
  touch-action: none;
}
.tl-line {
  position: absolute;
  left: 0;
  right: 0;
  top: 21px;
  height: 1px;
  background: rgba(216, 175, 110, .16);
}
.tl-fill {
  position: absolute;
  left: 0;
  top: 21px;
  height: 1px;
  width: 0;
  background: linear-gradient(90deg, rgba(216, 69, 47, .1), rgba(216, 69, 47, .9));
}
.tl-thumb {
  position: absolute;
  top: 21px;
  left: 0;
  width: 9px;
  height: 9px;
  margin: -4px 0 0 -4.5px;
  border-radius: 50%;
  background: var(--red-l);
  box-shadow: 0 0 0 3px rgba(216, 69, 47, .16), 0 0 14px rgba(255, 122, 85, .6);
  opacity: 0;
  transition: opacity .3s var(--ease), transform .2s var(--ease);
  pointer-events: none;
}
.tl:hover .tl-thumb, .tl.scrubbing .tl-thumb { opacity: 1; }
.tl.scrubbing .tl-thumb { transform: scale(1.25); }

.tl-dots { position: relative; height: 38px; }
.tl-dot {
  position: absolute;
  top: 0;
  transform: translateX(-50%);
  pointer-events: auto;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  font-family: var(--sans);
  color: inherit;
  text-align: center;
}
.tl:focus-visible { outline: 1px solid rgba(216, 175, 110, .4); outline-offset: 8px; }
.tl-dot i {
  display: block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #05080A;
  border: 1px solid rgba(216, 175, 110, .35);
  margin: 0 auto;
  transition: all .45s var(--ease);
}
.tl-dot span {
  font-size: 9.5px;
  letter-spacing: .16em;
  color: rgba(239, 228, 208, .28);
  transition: color .4s ease;
  white-space: nowrap;
}
.tl-dot:hover i { border-color: rgba(216, 175, 110, .85); }
.tl-dot.past i { background: rgba(216, 69, 47, .7); border-color: rgba(216, 69, 47, .8); }
.tl-dot.past span { color: rgba(239, 228, 208, .5); }
.tl-dot.on i {
  background: var(--red-l);
  border-color: var(--red-l);
  box-shadow: 0 0 0 4px rgba(216, 69, 47, .14), 0 0 16px rgba(255, 122, 85, .55);
  transform: scale(1.25);
}
.tl-dot.on span { color: var(--gold); }

.ctl { display: flex; align-items: center; gap: 8px; pointer-events: auto; padding-bottom: 2px; }
.ctl button {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  cursor: pointer;
  border: 1px solid rgba(216, 175, 110, .22);
  background: rgba(10, 15, 18, .55);
  color: rgba(239, 228, 208, .7);
  display: grid;
  place-items: center;
  transition: .28s ease;
  padding: 0;
}
.ctl button:hover {
  border-color: rgba(216, 175, 110, .6);
  color: var(--gold);
  background: rgba(30, 20, 12, .6);
}
.ctl button svg { width: 15px; height: 15px; display: block; }
.ctl .play { width: 46px; height: 46px; border-color: rgba(216, 175, 110, .4); color: var(--gold); }
.ctl .sep { width: 1px; height: 22px; background: rgba(216, 175, 110, .16); margin: 0 4px; }

.vol { display: flex; align-items: center; gap: 8px; }
.vol input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 74px;
  height: 22px;
  background: transparent;
  cursor: pointer;
  margin: 0;
}
.vol input[type="range"]::-webkit-slider-runnable-track {
  height: 2px;
  background: rgba(216, 175, 110, .28);
}
.vol input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--gold);
  margin-top: -3.5px;
}
.vol input[type="range"]::-moz-range-track { height: 2px; background: rgba(216, 175, 110, .28); }
.vol input[type="range"]::-moz-range-thumb {
  width: 9px;
  height: 9px;
  border: 0;
  border-radius: 50%;
  background: var(--gold);
}
.vol.muted input[type="range"] { opacity: .35; }

/* ---------- 地名史实卡 ---------- */
.card {
  position: fixed;
  z-index: 20;
  width: min(300px, calc(100vw - 32px));
  padding: 15px 17px 16px;
  border: 1px solid rgba(216, 175, 110, .28);
  border-radius: 2px;
  background: rgba(7, 11, 13, .93);
  box-shadow: 0 18px 48px rgba(0, 0, 0, .6), inset 0 0 0 1px rgba(255, 255, 255, .02);
  backdrop-filter: blur(8px) saturate(120%);
  pointer-events: none;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .22s var(--ease), transform .22s var(--ease);
}
.card.show { opacity: 1; transform: translateY(0); }
.card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 14px;
  width: 2px;
  height: 18px;
  background: linear-gradient(var(--gold), rgba(216, 175, 110, 0));
}
.card .card-head { display: flex; align-items: baseline; gap: 9px; margin-bottom: 7px; }
.card .card-t {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .06em;
  color: #F6EAD6;
}
.card .card-d {
  font-size: 9.5px;
  letter-spacing: .12em;
  color: rgba(216, 175, 110, .85);
  white-space: nowrap;
}
.card .card-x {
  font-size: 12px;
  line-height: 1.9;
  letter-spacing: .02em;
  color: var(--ink-2);
  font-weight: 300;
}

/* ---------- 封面 ---------- */
.cover {
  position: fixed;
  inset: 0;
  z-index: 40;
  overflow: hidden;
  background: #6d130c;
  transition: opacity 1s var(--ease);
}
.cover .poster {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 45%;
  transform: scale(1.06);
  animation: kenburns 26s ease-out forwards;
}
@keyframes kenburns {
  from { transform: scale(1.14); }
  to { transform: scale(1.02); }
}
.cover .veil {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(120% 90% at 18% 30%, rgba(0, 0, 0, 0) 0%, rgba(20, 4, 2, .18) 55%, rgba(8, 2, 1, .62) 100%),
    linear-gradient(to top, rgba(6, 3, 2, .88) 0%, rgba(6, 3, 2, .35) 26%, rgba(6, 3, 2, 0) 52%);
}
.cover .frame-line {
  position: absolute;
  inset: clamp(14px, 2.2vw, 26px);
  border: 1px solid rgba(240, 226, 200, .22);
  pointer-events: none;
}
.cover .inner {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: clamp(40px, 11vh, 110px);
  width: min(760px, 86vw);
  text-align: center;
  color: #F7EBD7;
}
.cover .enter-kicker {
  font-size: 10px;
  letter-spacing: .42em;
  color: rgba(248, 226, 190, .8);
  margin-bottom: 18px;
  opacity: 0;
  animation: rise .9s .25s var(--ease) forwards;
}
.cover h1 {
  font-family: var(--serif);
  font-size: clamp(30px, 4.6vw, 60px);
  font-weight: 900;
  letter-spacing: .14em;
  line-height: 1.08;
  margin: 0 0 16px;
  text-shadow: 0 6px 40px rgba(0, 0, 0, .55);
  opacity: 0;
  animation: rise 1s .4s var(--ease) forwards;
}
.cover .sub {
  font-size: clamp(11px, 1.1vw, 13px);
  letter-spacing: .26em;
  color: rgba(247, 231, 211, .72);
  opacity: 0;
  animation: rise 1s .6s var(--ease) forwards;
}
.cover .sub b { font-weight: 400; color: rgba(255, 216, 170, .95); }
.cover .divider {
  width: 0;
  height: 1px;
  margin: 22px auto;
  background: linear-gradient(90deg, rgba(255, 214, 168, .95), rgba(255, 214, 168, .05));
  animation: grow 1.2s .75s var(--ease) forwards;
}
.cover .enter {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  margin-top: 8px;
  padding: 12px 22px 12px 20px;
  border: 1px solid rgba(255, 226, 190, .42);
  background: rgba(28, 6, 3, .28);
  color: #FBEEDC;
  font-family: var(--sans);
  font-size: 12.5px;
  letter-spacing: .3em;
  cursor: pointer;
  opacity: 0;
  animation: rise 1s .85s var(--ease) forwards;
  transition: background .3s var(--ease), border-color .3s var(--ease), transform .3s var(--ease);
  backdrop-filter: blur(2px);
}
.cover .enter:hover {
  background: rgba(216, 69, 47, .28);
  border-color: rgba(255, 226, 190, .8);
  transform: translateY(-1px);
}
.cover .enter .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #FFB08A;
  box-shadow: 0 0 0 0 rgba(255, 176, 138, .6);
  animation: pulse 2.2s infinite;
}
.cover .enter svg { width: 14px; height: 14px; }
.cover .meta {
  position: absolute;
  right: clamp(24px, 5vw, 80px);
  bottom: clamp(40px, 12vh, 118px);
  text-align: right;
  font-size: 9.5px;
  letter-spacing: .22em;
  line-height: 2;
  color: rgba(247, 231, 211, .42);
  opacity: 0;
  animation: rise 1s 1s var(--ease) forwards;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes grow { from { width: 0; } to { width: 96px; } }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(255, 176, 138, .55); }
  70% { box-shadow: 0 0 0 12px rgba(255, 176, 138, 0); }
  100% { box-shadow: 0 0 0 0 rgba(255, 176, 138, 0); }
}

/* 进入过渡 */
.cover.leaving { opacity: 0; pointer-events: none; }
.cover.leaving .poster { transform: scale(1.24); transition: transform 1.2s var(--ease); animation: none; }
.cover.leaving .inner, .cover.leaving .meta, .cover.leaving .frame-line { opacity: 0; transition: opacity .5s var(--ease); }

.wipe {
  position: fixed;
  inset: 0;
  z-index: 45;
  pointer-events: none;
  transform: translateX(-102%) skewX(-8deg);
  background: linear-gradient(90deg,
    rgba(150, 26, 16, 0) 0%,
    rgba(150, 26, 16, .55) 8%,
    #C8341F 26%,
    #E4573A 52%,
    #F2A97C 74%,
    rgba(255, 214, 168, .9) 88%,
    rgba(255, 214, 168, 0) 100%);
  opacity: 0;
}
.wipe.run {
  opacity: 1;
  animation: sweep 1.05s cubic-bezier(.65, 0, .2, 1) forwards;
}
@keyframes sweep {
  0% { transform: translateX(-102%) skewX(-8deg); }
  100% { transform: translateX(102%) skewX(-8deg); }
}

/* ---------- 剧场模式 ---------- */
body.theater .chap,
body.theater .masthead,
body.theater .credit { opacity: 0; pointer-events: none; }
body.theater .hud { opacity: 0; transform: translateY(14px); pointer-events: none; }
body.theater .hud * { pointer-events: none; }
body.theater.show-ui .hud { opacity: 1; transform: translateY(0); pointer-events: none; }
body.theater.show-ui .hud .ctl,
body.theater.show-ui .hud .tl { pointer-events: auto; }

.theater-hint {
  position: fixed;
  top: clamp(18px, 3.4vh, 36px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 12;
  font-size: 9.5px;
  letter-spacing: .24em;
  color: rgba(239, 228, 208, .34);
  border: 1px solid rgba(216, 175, 110, .14);
  padding: 6px 12px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .4s var(--ease);
}
body.theater .theater-hint { opacity: 1; }

/* ---------- 首次提示 ---------- */
.hint {
  position: fixed;
  left: 50%;
  bottom: clamp(76px, 11vh, 104px);
  transform: translate(-50%, 8px);
  z-index: 11;
  padding: 8px 14px;
  font-size: 10.5px;
  letter-spacing: .16em;
  color: rgba(239, 228, 208, .62);
  background: rgba(7, 11, 13, .55);
  border: 1px solid rgba(216, 175, 110, .16);
  opacity: 0;
  pointer-events: none;
  transition: opacity .6s var(--ease), transform .6s var(--ease);
  white-space: nowrap;
}
.hint.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 880px) {
  .hint { display: none; }
}

/* ---------- 移动端 ---------- */
@media (max-width: 880px) {
  .chap {
    left: 16px;
    right: auto;
    width: calc(100vw - 32px);
    max-width: calc(100vw - 32px);
    top: auto;
    bottom: 112px;
    transform: none;
    overflow: hidden;
  }
  .chap h1 { font-size: 24px; margin-bottom: 9px; }
  .chap h1 .num { font-size: 10px; margin-bottom: 6px; }
  .chap p { font-size: 12px; line-height: 1.9; max-height: 5.7em; overflow: hidden; word-break: break-word; }
  .chap .chap-key { margin-top: 10px; font-size: 9px; padding: 4px 9px; }
  .hud { padding: 0 16px 12px; gap: 0; display: block; }
  .tl { padding: 12px 0 2px; }
  .tl-dot span { font-size: 8px; letter-spacing: .02em; }
  .tl-dot { gap: 8px; }
  .ctl { position: static; display: flex; justify-content: center; padding: 10px 0 2px; margin-top: 2px; gap: 10px; }
  .ctl .desk-only { display: none; }
  .vol input[type="range"] { width: 58px; }
  .masthead .en { display: none; }
  .credit { display: none; }
  .cover .inner { left: 50%; right: auto; width: calc(100vw - 44px); bottom: 96px; transform: translateX(-50%); }
  .cover .meta { display: none; }
  .cover .enter { padding: 11px 18px; font-size: 12px; letter-spacing: .24em; }
}

@media (prefers-reduced-motion: reduce) {
  .cover .poster { animation: none; }
  .cover *, .wipe, #stage { animation-duration: .01ms !important; transition-duration: .2s !important; }

  const RHO0 = Math.sqrt(CACON - 2 * NCONE * Math.sin(PHI0 * RAD)) / NCONE;

  function proj(lon, lat) {
    const rho = Math.sqrt(Math.max(0.0001, CACON - 2 * NCONE * Math.sin(lat * RAD))) / NCONE;
    const th = NCONE * (lon - LON0) * RAD;
    return [rho * Math.sin(th), -(RHO0 - rho * Math.cos(th))];
  }

  const PROV = [];
  let BBMINX = 1e9, BBMINY = 1e9, BBMAXX = -1e9, BBMAXY = -1e9;

  for (let i = 0; i < RAW_MAP.length; i++) {

    for (let r = 0; r < encRings.length; r++) {

      let x = 0, y = 0;
      const pts = [];
      for (let k = 0; k < enc.length; k += 2) {
        x += enc[k]; y += enc[k + 1];
        const q = proj(x / 100, y / 100);
        pts.push(q[0], q[1]);
        if (q[0] < BBMINX) BBMINX = q[0];
        if (q[0] > BBMAXX) BBMAXX = q[0];
        if (q[1] < BBMINY) BBMINY = q[1];
        if (q[1] > BBMAXY) BBMAXY = q[1];
      }
      if (pts.length >= 6) rings.push(pts);
    }
    if (rings.length) PROV.push({ name: RAW_MAP[i][0], rings: rings });
  }

  window.MAP = {
    proj: proj,
    prov: PROV,
    bbox: { minx: BBMINX, miny: BBMINY, maxx: BBMAXX, maxy: BBMAXY },
    width: BBMAXX - BBMINX,
    height: BBMAXY - BBMINY
  };

    lp.frequency.linearRampToValueAtTime(f * 3.4, t0 + dur);
    lp.connect(g);
    g.connect(bus);
    g.connect(reverbSend);

    [-5, 6].forEach(function (det) {
      const o = oc.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = f;
      o.detune.value = det;

      const lfo = oc.createOscillator();
      lfo.frequency.value = 5.1;
      const lg = oc.createGain();
      lg.gain.value = 4.5;
      lfo.connect(lg);
      lg.connect(o.detune);
      lfo.start(t0);
      lfo.stop(t0 + dur + 0.3);

      o.connect(lp);
      o.start(t0);
      o.stop(t0 + dur + 0.22);
    });
  }

  function reed(oc, t0, dur, midi, gain) {
    const f = mtof(midi);
    const g = oc.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.09);
    g.gain.setValueAtTime(gain * 0.92, t0 + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.18);
    g.connect(bus);
    g.connect(reverbSend);

    const o1 = oc.createOscillator();
    o1.type = 'triangle';
    o1.frequency.value = f;
    const o2 = oc.createOscillator();
    o2.type = 'sine';
    o2.frequency.value = f * 2;
    const o2g = oc.createGain();
    o2g.gain.value = 0.25;
    o2.connect(o2g);
    o2g.connect(g);
    o1.connect(g);
    o1.start(t0); o1.stop(t0 + dur + 0.25);
    o2.start(t0); o2.stop(t0 + dur + 0.25);
  }

  function strings(oc, t0, dur, midis, gain) {
    midis.forEach(function (m) {
      const f = mtof(m);
      const g = oc.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0 + 0.55);
      g.gain.setValueAtTime(gain, t0 + Math.max(0.6, dur - 0.4));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.7);

      const lp = oc.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 1150;
      lp.Q.value = 0.6;
      lp.connect(g);
      g.connect(bus);
      g.connect(reverbSend);

      [-7, 0, 7].forEach(function (det) {
        const o = oc.createOscillator();
        o.type = 'sawtooth';
        o.frequency.value = f;
        o.detune.value = det;
        o.connect(lp);
        o.start(t0);
        o.stop(t0 + dur + 0.8);
      });
    });
  }

  function bass(oc, t0, dur, midi, gain) {
    const f = mtof(midi);
    const g = oc.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.12);
    g.connect(bus);

    const o = oc.createOscillator();
    o.type = 'triangle';
    o.frequency.value = f;
    const o2 = oc.createOscillator();
    o2.type = 'sine';
    o2.frequency.value = f / 2;
    const o2g = oc.createGain();
    o2g.gain.value = 0.5;
    o2.connect(o2g);
    o2g.connect(g);
    o.connect(g);
    o.start(t0); o.stop(t0 + dur + 0.2);
    o2.start(t0); o2.stop(t0 + dur + 0.2);
  }

  function timpani(oc, t0, gain) {
    const g = oc.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
    g.connect(bus);
    g.connect(reverbSend);

    const o = oc.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(112, t0);
    o.frequency.exponentialRampToValueAtTime(54, t0 + 0.35);
    o.connect(g);
    o.start(t0); o.stop(t0 + 1);
  }

  function snare(oc, t0, noise, gain) {
    const g = oc.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
    g.connect(bus);
    g.connect(reverbSend);

    const n = oc.createBufferSource();
    n.buffer = noise;
    const bp = oc.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 1900;
    bp.Q.value = 0.9;
    n.connect(bp);
    bp.connect(g);
    n.start(t0);
    n.stop(t0 + 0.2);
  }

  function cymbal(oc, t0, noise, gain) {
    const g = oc.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.4);
    g.connect(bus);
    g.connect(reverbSend);

    const n = oc.createBufferSource();
    n.buffer = noise;
    const hp = oc.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 5200;
    n.connect(hp);
    hp.connect(g);
    n.start(t0);
    n.stop(t0 + 1.5);
  }

  function pluck(oc, t0, midi, gain) {
    const f = mtof(midi);
    const g = oc.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
    g.connect(bus);
    g.connect(reverbSend);

    const o = oc.createOscillator();
    o.type = 'triangle';
    o.frequency.value = f;
    o.connect(g);
    o.start(t0);
    o.stop(t0 + 0.6);
  }

  /* ---------- 编曲 ---------- */
  async function render() {
    const rate = 44100;
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OAC) return null;
    const oc = new OAC(2, Math.ceil(rate * LOOP), rate);

    bus = oc.createGain();
    bus.gain.value = 0.85;
    bus.connect(oc.destination);

    const conv = oc.createConvolver();
    conv.buffer = impulse(oc, 2.4, 3.2);
    const wet = oc.createGain();
    wet.gain.value = 0.5;
    conv.connect(wet);
    wet.connect(oc.destination);

    reverbSend = oc.createGain();
    reverbSend.gain.value = 0.22;
    reverbSend.connect(conv);

    const noise = noiseBuffer(oc, 1.6);

    for (let bar = 0; bar < BARS; bar++) {
      const t = bar * BAR;
      const sec = Math.floor(bar / 8) % 4;      // 0 引子 1 A 2 B 3 C
      const ch = CHORDS[CHORD_AT[bar % 8]];
      const cycle = Math.floor(bar / 8);

      // 弦乐铺底
      strings(oc, t, BAR * 0.98, [ch[0] + 12, ch[1] + 12, ch[2] + 12], 0.055);

      // 低音
      bass(oc, t, BEAT * 0.9, ch[0], 0.11);
      bass(oc, t + BEAT * 2, BEAT * 0.9, ch[0], 0.085);

      // 琶音
      const arpNotes = [ch[1] + 12, ch[2] + 12, ch[3] + 12, ch[2] + 12];
      if (sec === 0 || sec >= 2) {
        for (let k = 0; k < 4; k++) {
          pluck(oc, t + k * BEAT, arpNotes[k] + 12, 0.03);
        }
      }

      // 主题
      if (sec >= 1) {
        const theme = THEME[bar % 8];
        let cursor = t;
        theme.forEach(function (note) {
          const dur = note[1] * BEAT;
          if (sec === 1) reed(oc, cursor, dur * 0.96, note[0], 0.1);
          else brass(oc, cursor, dur * 0.94, note[0] + (sec === 3 && cycle === 3 ? 12 : 0), sec === 3 ? 0.1 : 0.075);
          cursor += dur;
        });
      }

      // 打击
      if (sec >= 1) {
        timpani(oc, t, sec === 3 ? 0.16 : 0.1);
        if (bar % 8 === 3 || bar % 8 === 7) timpani(oc, t + BEAT * 3.5, 0.08);
      }
      if (sec >= 2) {
        snare(oc, t + BEAT, noise, 0.05);
        snare(oc, t + BEAT * 3, noise, 0.055);
        snare(oc, t + BEAT * 2.75, noise, 0.022);
      }
      if (sec === 3 && bar % 8 === 0) {
        cymbal(oc, t, noise, 0.045);
      }
      // 段落收束
      if (bar % 8 === 7 && sec >= 1) {
        timpani(oc, t + BAR - BEAT * 0.5, 0.2);
      }
    }

    // 尾音：最后一小节延长和弦，接回引子
    const lastT = (BARS - 1) * BAR;
    strings(oc, lastT + BAR * 0.5, BAR * 1.1, [62, 66, 69, 74], 0.05);

    const rendered = await oc.startRendering();
    return rendered;
  }

  function connectOut() {
    srcNode = ctx.createBufferSource();
    srcNode.buffer = buffer;
    srcNode.loop = true;
    outGain = ctx.createGain();
    outGain.gain.value = 0;
    srcNode.connect(outGain);
    outGain.connect(ctx.destination);
    srcNode.start(0);
    outGain.gain.linearRampToValueAtTime(muted ? 0 : volume, ctx.currentTime + 1.6);
  }

  async function start() {
    if (playing) return;
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') {
      try { await ctx.resume(); } catch (e) { /* ignore */ }
    }
    if (!buffer) {
      if (!building) building = render().then(function (b) { buffer = b; }).catch(function () { buffer = null; });
      await building;
    }
    if (!buffer) return;
    connectOut();
    playing = true;
  }

  function setVolume(v) {
    volume = Math.max(0, Math.min(1, v));
    if (outGain && ctx) {
      outGain.gain.cancelScheduledValues(ctx.currentTime);
      outGain.gain.setTargetAtTime(muted ? 0 : volume, ctx.currentTime, 0.15);
    }
  }

  function setMuted(m) {
    muted = !!m;
    if (outGain && ctx) {
      outGain.gain.cancelScheduledValues(ctx.currentTime);
      outGain.gain.setTargetAtTime(muted ? 0 : volume, ctx.currentTime, 0.12);
    }
  }

  window.Music = {
    start: start,
    setVolume: setVolume,
    getVolume: function () { return volume; },
    setMuted: setMuted,
    isMuted: function () { return muted; },
    isPlaying: function () { return playing; }
  };
})();

</script>
<script>
/* =========================================================
   星星之火 · 井冈山道路
   渲染 · 交互 · 进度条 · 史实卡 · 剧场模式
   ========================================================= */
(function () {
  'use strict';

  const MAP = window.MAP;
  const FRAMES = window.FRAMES;
  const proj = MAP.proj;
  const PROV = MAP.prov;
  const BB = MAP.bbox;

  const N = FRAMES.length;
  const LAST = N - 1;
  const FRAME_LEN = 8.6;

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  let W = 0, H = 0, DPR = 1, BASE = 1, AX = 0, AY = 0;

  const view = { cx: 0, cy: 0, z: 1 };
  const target = { cx: 0, cy: 0, z: 1 };
  const state = { i: 0, ft: FRAME_LEN, playing: false, elapsed: 0, entered: false };

  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 星空 ---------- */
  const STARS = [];
  for (let i = 0; i < 170; i++) {
    STARS.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.1 + 0.25, a: Math.random() * 0.42 + 0.12, p: Math.random() * 6.28 });
  }

  /* ---------- 军阀控制区（1927 年前后，示意） ---------- */
  const WARLORDS = [
    { name: '奉系', color: [122, 60, 42], provs: ['辽宁', '吉林', '黑龙江', '河北', '北京', '天津'] },
    { name: '直鲁联军', color: [112, 76, 44], provs: ['山东', '河南'] },
    { name: '孙传芳', color: [96, 70, 62], provs: ['江苏', '浙江', '安徽', '福建', '江西', '上海'] },
    { name: '晋系与国民军', color: [88, 74, 58], provs: ['山西', '陕西', '甘肃', '内蒙古', '宁夏', '青海'] },
    { name: '西南军阀', color: [78, 62, 56], provs: ['云南', '贵州', '四川', '重庆', '广西', '湖南'] }
  ];

  const PROV_GROUP = {};
  WARLORDS.forEach(function (w, gi) {
    w.provs.forEach(function (name) { PROV_GROUP[name] = gi; });
  });

  /* 各派系色块的中心点（用于标注派系名） */
  WARLORDS.forEach(function (w) {
    let ax = 0, ay = 0, n = 0;
    PROV.forEach(function (p) {
      if (w.provs.indexOf(p.name) < 0) return;
      p.rings.forEach(function (r) {
        for (let i = 0; i < r.length; i += 2) { ax += r[i]; ay += r[i + 1]; n++; }
      });
    });
    w.cx = n ? ax / n : 0;
    w.cy = n ? ay / n : 0;
  });

  /* ---------- 星火（全国点阵，仅最后一幕） ---------- */
  const SPARKS = (function () {
    const rings = [];
    PROV.forEach(function (p) { p.rings.forEach(function (r) { if (r.length >= 8) rings.push(r); }); });

    function inside(x, y) {
      for (let k = 0; k < rings.length; k++) {
        const r = rings[k];
        let c = false;
        for (let i = 0, j = r.length - 2; i < r.length; j = i, i += 2) {
          const xi = r[i], yi = r[i + 1], xj = r[j], yj = r[j + 1];
          if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
        }
        if (c) return true;
      }
      return false;
    }

    const origin = proj(114.17, 26.57);
    const pts = [];
    let tries = 0;
    while (pts.length < 650 && tries < 80000) {
      tries++;
      const x = BB.minx + Math.random() * (BB.maxx - BB.minx);
      const y = BB.miny + Math.random() * (BB.maxy - BB.miny);
      if (!inside(x, y)) continue;
      const d = Math.hypot(x - origin[0], y - origin[1]);
      pts.push({ x: x, y: y, d: d, ph: Math.random() * 6.28, r: 0.8 + Math.random() * 1.3 });
    }
    const maxD = pts.reduce(function (m, p) { return Math.max(m, p.d); }, 1);
    pts.forEach(function (p) { p.t0 = 1.1 + 3.6 * (p.d / maxD) + Math.random() * 0.5; });
    return pts;
  })();

  /* ---------- 尺寸与投影 ---------- */
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    const narrow = W < 880;
    BASE = Math.min(W * (narrow ? 0.94 : 0.9) / MAP.width, H * (narrow ? 0.52 : 0.84) / MAP.height);
    AX = narrow ? W * 0.5 : W * 0.5 + Math.min(88, W * 0.062);
    AY = narrow ? H * 0.335 : H * 0.46;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  const sc = () => BASE * view.z;
  const sx = (px) => AX + (px - view.cx) * sc();
  const sy = (py) => AY + (py - view.cy) * sc();
  const S = (lon, lat) => { const q = proj(lon, lat); return [sx(q[0]), sy(q[1])]; };

  const ease = (p) => { p = p < 0 ? 0 : p > 1 ? 1 : p; return p * p * (3 - 2 * p); };
  const easeOut = (p) => { p = p < 0 ? 0 : p > 1 ? 1 : p; return 1 - Math.pow(1 - p, 3); };
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  /* ---------- 绘制基元 ---------- */
  function bg() {
    const g = ctx.createRadialGradient(W * 0.56, H * 0.48, 0, W * 0.56, H * 0.48, Math.max(W, H) * 0.85);
    g.addColorStop(0, '#0b1114');
    g.addColorStop(0.55, '#070b0e');
    g.addColorStop(1, '#040607');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < STARS.length; i++) {
      const s = STARS[i];
      const a = s.a * (0.55 + 0.45 * Math.sin(state.elapsed * 0.55 + s.p));
      if (a <= 0.02) continue;
      ctx.fillStyle = 'rgba(222,200,168,' + (a * 0.5).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, 6.2832);
      ctx.fill();
    }
  }

  function buildChinaPath() {
    ctx.beginPath();
    for (let p = 0; p < PROV.length; p++) {
      const rings = PROV[p].rings;
      for (let r = 0; r < rings.length; r++) {
        const pts = rings[r];
        for (let k = 0; k < pts.length; k += 2) {
          const X = sx(pts[k]), Y = sy(pts[k + 1]);
          if (k === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
        }
        ctx.closePath();
      }
    }
  }

  function drawLand() {
    buildChinaPath();
    ctx.save();
    ctx.shadowColor = 'rgba(198,54,38,.13)';
    ctx.shadowBlur = view.z < 1.7 ? 46 : 0;
    ctx.fillStyle = '#101d1e';
    ctx.fill();
    ctx.restore();

    buildChinaPath();
    ctx.fillStyle = '#101d1e';
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#101d1e';
    ctx.stroke();

    // 经纬网
    ctx.strokeStyle = 'rgba(216,175,110,.072)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let lon = 70; lon <= 145; lon += 10) {
      for (let lat = 15; lat <= 55; lat += 2) {
        const q = proj(lon, lat), X = sx(q[0]), Y = sy(q[1]);
        if (lat === 15) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
      }
    }
    for (let lat = 10; lat <= 60; lat += 10) {
      for (let lon = 70; lon <= 145; lon += 2) {
        const q = proj(lon, lat), X = sx(q[0]), Y = sy(q[1]);
        if (lon === 70) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
      }
    }
    ctx.stroke();

    // 省界
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(216,175,110,.19)';
    buildChinaPath();
    ctx.stroke();
  }

  function drawVignette() {
    const g = ctx.createRadialGradient(W * 0.5, H * 0.52, Math.min(W, H) * 0.34, W * 0.5, H * 0.52, Math.max(W, H) * 0.8);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,.7)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function halo(X, Y, r, a, col) {
    if (r <= 0) return;
    const g = ctx.createRadialGradient(X, Y, 0, X, Y, r);
    g.addColorStop(0, 'rgba(' + col + ',' + a.toFixed(3) + ')');
    g.addColorStop(0.42, 'rgba(' + col + ',' + (a * 0.4).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(X, Y, r, 0, 6.2832);
    ctx.fill();
  }

  function ripple(X, Y, r, a) {
    ctx.strokeStyle = 'rgba(255,104,70,' + a.toFixed(3) + ')';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(X, Y, r, 0, 6.2832);
    ctx.stroke();
  }

  function label(txt, X, Y, dir, opt) {
    opt = opt || {};
    const left = dir.indexOf('l') >= 0;
    const down = dir.indexOf('b') >= 0;
    ctx.save();
    ctx.font = '400 ' + (opt.size || 11.5) + 'px "Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = left ? 'right' : 'left';
    ctx.textBaseline = 'middle';
    const lx = X + (left ? -10 : 10);
    const ly = Y + (down ? 11 : -11);
    ctx.lineWidth = 3.2;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(4,7,9,.92)';
    ctx.strokeText(txt, lx, ly);
    ctx.fillStyle = opt.color || 'rgba(238,226,205,.82)';
    ctx.fillText(txt, lx, ly);
    ctx.restore();
  }

  function drawNode(n, ft) {
    if (n.k === 'none') return;
    const prog = easeOut((ft - n.s) / (n.d || 0.7));
    if (prog <= 0.001) return;
    const pt = S(n.lon, n.lat);
    const X = pt[0], Y = pt[1];
    const t = state.elapsed;

    if (n.k === 'city') {
      ctx.globalAlpha = prog;
      ctx.fillStyle = 'rgba(6,10,12,.9)';
      ctx.beginPath(); ctx.arc(X, Y, 4, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = 'rgba(226,214,192,.5)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(X, Y, 4, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = 'rgba(226,214,192,.8)';
      ctx.beginPath(); ctx.arc(X, Y, 1.5, 0, 6.2832); ctx.fill();
      if (n.label) label(n.label, X, Y, n.dir || 'r', { size: 10.5, color: 'rgba(226,214,192,.6)' });
      ctx.globalAlpha = 1;
      return;
    }

    if (n.k === 'fail') {
      ctx.globalAlpha = prog;
      ctx.fillStyle = 'rgba(120,40,32,.5)';
      ctx.beginPath(); ctx.arc(X, Y, 4.2, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = 'rgba(196,72,54,.5)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(X, Y, 4.2, 0, 6.2832); ctx.stroke();
      ctx.strokeStyle = 'rgba(200,76,58,.72)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(X - 3.4, Y - 3.4); ctx.lineTo(X + 3.4, Y + 3.4);
      ctx.moveTo(X + 3.4, Y - 3.4); ctx.lineTo(X - 3.4, Y + 3.4);
      ctx.stroke();
      if (n.label) label(n.label, X, Y, n.dir || 'r', { size: 10.5, color: 'rgba(214,150,136,.72)' });
      ctx.globalAlpha = 1;
      return;
    }

    if (n.k === 'win') {
      ctx.globalAlpha = prog;
      halo(X, Y, 54, 0.28 * prog, '255,96,64');
      for (let i = 0; i < 3; i++) {
        const ph = ((t * 0.55 + i / 3) % 1);
        ripple(X, Y, 5 + ph * 40, (1 - ph) * (1 - ph) * 0.4 * prog);
      }
      ctx.fillStyle = 'rgba(255,132,96,' + (0.95 * prog).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(X, Y, 4.6, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(255,236,214,' + (0.9 * prog).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(X, Y, 1.9, 0, 6.2832); ctx.fill();
      if (n.label) label(n.label, X, Y, n.dir || 'r', { size: 10.8, color: 'rgba(248,206,178,.86)' });
      ctx.globalAlpha = 1;
      return;
    }

    if (n.k === 'base') {
      ctx.globalAlpha = prog;
      halo(X, Y, 38, 0.24 * prog, '232,74,48');
      for (let i = 0; i < 2; i++) {
        const ph = ((t * 0.5 + i / 2) % 1);
        ripple(X, Y, 5 + ph * 32, (1 - ph) * (1 - ph) * 0.38 * prog);
      }
      ctx.fillStyle = 'rgba(238,96,64,' + (0.9 * prog).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(X, Y, 3.6, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(255,224,196,' + (0.85 * prog).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(X, Y, 1.4, 0, 6.2832); ctx.fill();
      if (n.label) {
        label(n.label, X, Y, n.dir || 'r', {
          size: n.small ? 10 : 11,
          color: n.small ? 'rgba(226,206,184,.58)' : 'rgba(240,224,202,.82)'
        });
      }
      ctx.globalAlpha = 1;
      return;
    }

    // star
    ctx.globalAlpha = prog;
    halo(X, Y, 84, 0.4 * prog, '255,92,58');
    halo(X, Y, 34, 0.5 * prog, '255,168,110');
    for (let i = 0; i < 3; i++) {
      const ph = ((t * 0.42 + i / 3) % 1);
      ripple(X, Y, 7 + ph * 62, (1 - ph) * (1 - ph) * 0.45 * prog);
    }
    const pulse = 1 + 0.16 * Math.sin(t * 2.1);
    const R = 17 * pulse;
    ctx.save();
    ctx.translate(X, Y);
    const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
    grd.addColorStop(0, 'rgba(255,244,226,' + (0.95 * prog).toFixed(3) + ')');
    grd.addColorStop(0.35, 'rgba(255,150,100,' + (0.5 * prog).toFixed(3) + ')');
    grd.addColorStop(1, 'rgba(255,120,80,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(255,226,190,' + (0.65 * prog).toFixed(3) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-R * 1.55, 0); ctx.lineTo(R * 1.55, 0);
    ctx.moveTo(0, -R * 1.55); ctx.lineTo(0, R * 1.55);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,248,238,' + (0.95 * prog).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(0, 0, 3.2, 0, 6.2832); ctx.fill();
    ctx.restore();

    if (n.label) label(n.label, X, Y, n.dir || 'r', { size: 13.5, color: 'rgba(255,236,214,.95)' });

    if (n.sub) {
      const a2 = clamp((ft - n.s - 0.45) / 0.9, 0, 1);
      if (a2 > 0) {
        const left = (n.dir || 'r').indexOf('l') >= 0;
        const down = (n.dir || 'r').indexOf('b') >= 0;
        ctx.save();
        ctx.globalAlpha = a2;
        ctx.font = '300 10.5px "Noto Sans SC",-apple-system,sans-serif';
        ctx.textAlign = left ? 'right' : 'left';
        ctx.textBaseline = 'middle';
        const lx = X + (left ? -10 : 10);
        const ly = Y + (down ? 30 : -31);
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(4,7,9,.92)';
        ctx.strokeText(n.sub, lx, ly);
        ctx.fillStyle = 'rgba(216,175,110,.88)';
        ctx.fillText(n.sub, lx, ly);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
  }

  function smoothPts(pts) {
    if (pts.length < 3) return pts.slice();
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || pts[i + 1];
      for (let j = 0; j < 10; j++) {
        const u = j / 10, u2 = u * u, u3 = u2 * u;
        out.push([
          0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3),
          0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3)
        ]);
      }
    }
    out.push(pts[pts.length - 1]);
    return out;
  }

  function routeScreenPoints(rt) {
    if (!rt._sp) {
      rt._sp = smoothPts(rt.pts.map(function (q) { return proj(q[0], q[1]); }));
    }
    const out = new Array(rt._sp.length);
    const s = sc(), ax = AX, ay = AY, cx = view.cx, cy = view.cy;
    for (let i = 0; i < rt._sp.length; i++) {
      out[i] = [ax + (rt._sp[i][0] - cx) * s, ay + (rt._sp[i][1] - cy) * s];
    }
    return out;
  }

  function strokePath(pts, tgt, alpha, width, dashed) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    let acc = 0;
    let endX = pts[0][0], endY = pts[0][1];
    for (let i = 1; i < pts.length; i++) {
      const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      if (acc + d >= tgt) {
        const k = (tgt - acc) / (d || 1);
        endX = pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * k;
        endY = pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * k;
        ctx.lineTo(endX, endY);
        break;
      }
      ctx.lineTo(pts[i][0], pts[i][1]);
      acc += d;
      endX = pts[i][0];
      endY = pts[i][1];
    }
    ctx.strokeStyle = 'rgba(226,186,124,' + alpha + ')';
    ctx.lineWidth = width;
    if (dashed) {
      ctx.setLineDash([7, 9]);
      ctx.lineDashOffset = -state.elapsed * 26;
    }
    ctx.stroke();
    ctx.restore();
    return [endX, endY];
  }

  function drawBeads(pts, tgt) {
    let acc = 0;
    let next = 16;
    ctx.fillStyle = 'rgba(242,208,152,.72)';
    for (let i = 1; i < pts.length; i++) {
      const seg = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      while (next <= acc + seg && next <= tgt) {
        const k = (next - acc) / (seg || 1);
        const x = pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * k;
        const y = pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * k;
        ctx.beginPath();
        ctx.arc(x, y, 1.5, 0, 6.2832);
        ctx.fill();
        next += 16;
      }
      acc += seg;
    }
  }

  function drawRoute(rt, ft) {
    const p = ease((ft - rt.s) / (rt.d || 1.6));
    if (p <= 0.001) return;
    const pts = routeScreenPoints(rt);

    let total = 0;
    for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (total < 1) return;

    ctx.save();
    ctx.shadowColor = 'rgba(214,168,92,.5)';
    ctx.shadowBlur = 9;
    const tgt = total * easeOut(p);
    const end = strokePath(pts, tgt, '0.85', 1.5, true);
    drawBeads(pts, tgt);
    ctx.restore();

    const g = ctx.createRadialGradient(end[0], end[1], 0, end[0], end[1], 13);
    g.addColorStop(0, 'rgba(255,238,208,.9)');
    g.addColorStop(0.4, 'rgba(255,180,110,.45)');
    g.addColorStop(1, 'rgba(255,160,90,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(end[0], end[1], 13, 0, 6.2832);
    ctx.fill();
  }

  /* 已经走过的路线：暗金细线，留在图上 */
  function drawTrail() {
    for (let i = 0; i < state.i; i++) {
      const rs = FRAMES[i].routes;
      for (let r = 0; r < rs.length; r++) {
        const pts = routeScreenPoints(rs[r]);
        let total = 0;
        for (let j = 1; j < pts.length; j++) total += Math.hypot(pts[j][0] - pts[j - 1][0], pts[j][1] - pts[j - 1][1]);
        if (total < 1) continue;
        strokePath(pts, total, '0.30', 1.0, false);
      }
    }
  }

  /* 军阀控制区：第 2 页淡入，第 5 页（转兵）逐块淡出 */
  function drawWarlord() {
    const idx = state.i, ft = state.ft;
    if (idx === 0 || idx > 4) return;
    let base = 1;
    if (idx === 1) base = clamp((ft - 0.2) / 1.6, 0, 1);

    for (let g = 0; g < WARLORDS.length; g++) {
      let a = base;
      if (idx === 4) a = clamp(1 - (ft - g * 0.14) / 2.6, 0, 1);
      if (a <= 0.005) continue;
      const col = WARLORDS[g].color;
      ctx.save();
      ctx.beginPath();
      for (let p = 0; p < PROV.length; p++) {
        if (PROV_GROUP[PROV[p].name] !== g) continue;
        const rings = PROV[p].rings;
        for (let r = 0; r < rings.length; r++) {
          const pts = rings[r];
          for (let k = 0; k < pts.length; k += 2) {
            const X = sx(pts[k]), Y = sy(pts[k + 1]);
            if (k === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
          }
          ctx.closePath();
        }
      }
      ctx.fillStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + (0.34 * a).toFixed(3) + ')';
      ctx.fill();
      ctx.restore();

      if (a > 0.18) {
        const X = sx(WARLORDS[g].cx), Y = sy(WARLORDS[g].cy);
        ctx.save();
        ctx.font = '500 12px "Noto Sans SC",-apple-system,"Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(4,7,9,.72)';
        ctx.strokeText(WARLORDS[g].name, X, Y);
        ctx.fillStyle = 'rgba(244,230,206,' + (0.7 * a).toFixed(3) + ')';
        ctx.fillText(WARLORDS[g].name, X, Y);
        ctx.restore();
      }
    }

    if (base > 0.25) {
      ctx.save();
      ctx.font = '400 10px "Noto Sans SC",-apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(239,228,208,' + (0.34 * base).toFixed(3) + ')';
      ctx.fillText('1926—1928 年各派系主要控制区域 · 示意', W * 0.5, H - 150);
      ctx.restore();
    }

    // 省界压回去
    ctx.save();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(216,175,110,.16)';
    buildChinaPath();
    ctx.stroke();
    ctx.restore();
  }

  /* 重大事件点上的星火：火星上升、明灭 */
  function drawNodeSparks(F, ft) {
    const t = state.elapsed;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < F.nodes.length; i++) {
      const n = F.nodes[i];
      if (n.k !== 'star' && !n.spark) continue;
      const p = easeOut((ft - n.s) / (n.d || 0.7));
      if (p <= 0.05) continue;
      const pt = S(n.lon, n.lat);
      const spread = n.k === 'star' ? 26 : 17;
      const count = n.k === 'star' ? 16 : 12;
      for (let j = 0; j < count; j++) {
        const seed = (i * 41 + j * 17) % 997;
        const ph = ((t * 0.42 + seed * 0.013 + j * 0.09) % 1);
        const ang = (seed % 628) / 100;
        const rad = spread * (0.25 + 0.75 * ((seed * 7) % 100) / 100);
        const x = pt[0] + Math.cos(ang) * rad * (0.6 + 0.4 * ph);
        const y = pt[1] + Math.sin(ang) * rad * 0.55 - ph * 34;
        const fade = Math.sin(ph * Math.PI);
        if (fade <= 0) continue;
        const a = p * fade * (0.55 + 0.45 * Math.sin(t * 5 + seed));
        ctx.fillStyle = 'rgba(255,168,104,' + (a * 0.55).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(x, y, 1.5, 0, 6.2832);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,240,210,' + (a * 0.45).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(x, y, 0.7, 0, 6.2832);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  /* 星火：最后一页全国点阵依次亮起 */
  function drawSparks() {
    const ft = state.ft;
    const t = state.elapsed;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < SPARKS.length; i++) {
      const s = SPARKS[i];
      const a = clamp((ft - s.t0) / 0.9, 0, 1);
      if (a <= 0) continue;
      const flick = 0.55 + 0.45 * Math.sin(t * 2.6 + s.ph);
      const X = sx(s.x), Y = sy(s.y);
      const r = s.r * (0.7 + 0.5 * a);
      ctx.fillStyle = 'rgba(255,186,116,' + (0.5 * a * flick).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(X, Y, r, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,242,214,' + (0.32 * a * flick).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(X, Y, r * 0.45, 0, 6.2832);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSweep(F, ft) {
    const s = F.sweep;
    if (!s) return;
    const p = clamp((ft - s.start) / s.dur, 0, 1);
    if (p <= 0) return;
    const e = ease(p);
    const topY = sy(BB.miny), botY = sy(BB.maxy);
    const y = topY + (botY - topY) * e;

    ctx.save();
    buildChinaPath();
    ctx.clip();
    ctx.fillStyle = 'rgba(196,52,36,.15)';
    ctx.fillRect(0, 0, W, y);
    const g = ctx.createLinearGradient(0, y - 150, 0, y);
    g.addColorStop(0, 'rgba(222,78,52,0)');
    g.addColorStop(1, 'rgba(238,104,70,.34)');
    ctx.fillStyle = g;
    ctx.fillRect(0, Math.max(0, y - 150), W, 150);
    ctx.restore();

    ctx.save();
    buildChinaPath();
    ctx.clip();
    ctx.strokeStyle = 'rgba(255,150,110,.45)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
    ctx.restore();
  }

  /* ---------- 悬停高亮 ---------- */
  let hoverNode = null;

  function drawHoverRing() {
    if (!hoverNode) return;
    const pt = S(hoverNode.lon, hoverNode.lat);
    const R = 15 + Math.sin(state.elapsed * 3) * 1.5;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,232,206,.75)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.arc(pt[0], pt[1], R, 0, 6.2832);
    ctx.stroke();
    ctx.restore();
  }

  /* ---------- 主渲染 ---------- */
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    bg();
    drawLand();
    drawWarlord();
    drawVignette();

    const F = FRAMES[state.i];
    drawTrail();
    if (F.sweep) drawSweep(F, state.ft);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < F.nodes.length; i++) {
      const n = F.nodes[i];
      if (n.k !== 'base' && n.k !== 'win' && n.k !== 'star') continue;
      const prog = easeOut((state.ft - n.s) / (n.d || 0.7));
      if (prog <= 0.001) continue;
      const pt = S(n.lon, n.lat);
      const r = (n.k === 'star' ? 0.95 : 0.6) * prog * 44 * Math.min(2.2, Math.max(1, view.z * 0.85));
      halo(pt[0], pt[1], r, (n.k === 'star' ? 0.3 : 0.18) * prog, '226,64,42');
    }
    ctx.restore();

    for (let i = 0; i < F.routes.length; i++) drawRoute(F.routes[i], state.ft);
    for (let i = 0; i < F.nodes.length; i++) drawNode(F.nodes[i], state.ft);
    drawNodeSparks(F, state.ft);
    if (state.i === LAST) drawSparks();
    drawHoverRing();
  }

  /* ---------- 相机与循环 ---------- */
  let lastT = performance.now();

  function loop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    state.elapsed += dt;

    if (state.ft < FRAME_LEN) state.ft = Math.min(FRAME_LEN, state.ft + dt);

    if (state.playing && state.ft >= FRAME_LEN) {
      if (state.i < LAST) {
        beginFrame(state.i + 1, reduced);
      } else {
        state.playing = false;
        updatePlayIcon();
      }
    }

    const k = 1 - Math.exp(-dt / 0.62);
    view.cx += (target.cx - view.cx) * k;
    view.cy += (target.cy - view.cy) * k;
    view.z = Math.exp(Math.log(view.z) + (Math.log(target.z) - Math.log(view.z)) * k);

    draw();
    paintProgress();
    requestAnimationFrame(loop);
  }

  /* ---------- 章节 ---------- */
  const kickerEl = document.getElementById('kicker');
  const titleEl = document.getElementById('title');
  const bodyEl = document.getElementById('body');
  const keyEl = document.getElementById('key');
  const chapEl = document.getElementById('chap');
  const tlf = document.getElementById('tlf');
  const tld = document.getElementById('tld');
  const tlthumb = document.getElementById('tlthumb');
  const tlEl = document.getElementById('tl');
  const playBtn = document.getElementById('play');
  const ico = document.getElementById('ico');

  const dataEl = document.getElementById('data');

  const TL_LABELS = ['开篇', '1927', '起义', '基础', '转兵', '上山', '会师', '下山', '古田', '攻长沙', '长征', '敌后', '决战', '燎原'];

  (function buildTimeline() {
    for (let i = 0; i < FRAMES.length; i++) {
      const b = document.createElement('button');
      b.className = 'tl-dot';
      b.type = 'button';
      b.dataset.i = String(i);
      b.style.left = (i / LAST * 100) + '%';
      b.setAttribute('aria-label', '第' + (i + 1) + '页 ' + FRAMES[i].title);
      b.innerHTML = '<i></i><span>' + TL_LABELS[i] + '</span>';
      tld.appendChild(b);
    }
  })();

  function paintUI(i) {
    const F = FRAMES[i];
    kickerEl.textContent = F.kicker;
    titleEl.innerHTML = '<span class="num">' + F.year + '</span>' + F.title;
    bodyEl.textContent = F.body;
    keyEl.textContent = F.key;
    if (dataEl) {
      dataEl.textContent = F.data || '';
      dataEl.style.display = F.data ? '' : 'none';
    }

    chapEl.classList.remove('in');
    void chapEl.offsetWidth;
    chapEl.classList.add('in');

    const dots = tld.children;
    for (let d = 0; d < dots.length; d++) {
      dots[d].classList.toggle('on', d === i);
      dots[d].classList.toggle('past', d < i);
    }
    tlEl.setAttribute('aria-valuenow', String(i));
  }

  function paintProgress() {
    const u = state.i + Math.min(0.999, state.ft / FRAME_LEN);
    const p = clamp(u / LAST, 0, 1) * 100;
    tlf.style.width = p + '%';
    tlthumb.style.left = p + '%';
  }

  function beginFrame(i, instant) {
    i = clamp(i, 0, LAST);
    state.i = i;
    state.ft = (instant || reduced) ? FRAME_LEN : 0;
    const F = FRAMES[i];
    const v = proj(F.view.lon, F.view.lat);
    target.cx = v[0];
    target.cy = v[1];
    target.z = F.view.z;
    paintUI(i);
    updatePlayIcon();
    hideCard(true);
  }

  function goTo(i) {
    beginFrame(i, false);
  }

  function updatePlayIcon() {
    if (state.playing) {
      ico.innerHTML = '<path d="M7 5h4v14H7zM14 5h4v14h-4z"/>';
      playBtn.setAttribute('aria-label', '暂停连播');
    } else {
      ico.innerHTML = '<path d="M8 5l11 7-11 7z"/>';
      playBtn.setAttribute('aria-label', '连续播放');
    }
  }

  playBtn.addEventListener('click', function () {
    if (state.i === LAST && state.ft >= FRAME_LEN) {
      beginFrame(0, false);
      state.playing = true;
    } else {
      if (!state.playing && state.ft >= FRAME_LEN - 0.02) state.ft = 0;
      state.playing = !state.playing;
    }
    updatePlayIcon();
  });

  document.getElementById('prev').addEventListener('click', function () { goTo(state.i - 1); });
  document.getElementById('next').addEventListener('click', function () { goTo(state.i + 1); });

  /* ---------- 进度条拖动 ---------- */
  let scrubbing = false;
  let scrubMoved = false;
  let scrubStartX = 0;
  let scrubStartU = 0;

  function uFromEvent(e) {
    const r = tlEl.getBoundingClientRect();
    const x = clamp(e.clientX - r.left, 0, r.width);
    return (x / r.width) * LAST;
  }

  function applyU(u) {
    u = clamp(u, 0, LAST);
    const i = Math.min(LAST, Math.floor(u + 0.0001));
    const ft = clamp((u - i) * FRAME_LEN, 0, FRAME_LEN);
    const changed = i !== state.i;
    state.i = i;
    state.ft = ft;
    if (changed) {
      const F = FRAMES[i];
      const v = proj(F.view.lon, F.view.lat);
      target.cx = v[0];
      target.cy = v[1];
      target.z = F.view.z;
      paintUI(i);
    }
  }

  tlEl.addEventListener('pointerdown', function (e) {
    scrubbing = true;
    scrubMoved = false;
    scrubStartX = e.clientX;
    scrubStartU = uFromEvent(e);
    tlEl.classList.add('scrubbing');
    hideHint();
    try { tlEl.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
    e.stopPropagation();
  });

  tlEl.addEventListener('pointermove', function (e) {
    if (!scrubbing) return;
    if (Math.abs(e.clientX - scrubStartX) > 3) scrubMoved = true;
    if (scrubMoved) {
      state.playing = false;
      updatePlayIcon();
      applyU(uFromEvent(e));
    }
    e.stopPropagation();
  });

  function endScrub(e) {
    if (!scrubbing) return;
    scrubbing = false;
    tlEl.classList.remove('scrubbing');
    const u = uFromEvent(e);
    if (!scrubMoved) {
      // 单击：点圆点跳该幕，点轨道按比例定位
      const dot = e.target && e.target.closest ? e.target.closest('.tl-dot') : null;
      if (dot) {
        goTo(parseInt(dot.dataset.i, 10));
      } else {
        applyU(u);
        state.ft = 0;
        state.playing = false;
        updatePlayIcon();
        paintUI(state.i);
      }
    } else {
      state.ft = clamp(state.ft, 0, FRAME_LEN);
    }
  }

  tlEl.addEventListener('pointerup', endScrub);
  tlEl.addEventListener('pointercancel', function () {
    scrubbing = false;
    tlEl.classList.remove('scrubbing');
  });

  /* ---------- 画布交互：拖拽 / 缩放 / 悬停 / 点击 ---------- */
  let dragging = false;
  let dragMoved = false;
  let dragStart = null;
  let viewAtDrag = null;
  let downNode = null;

  function pointAt(x, y) {
    const F = FRAMES[state.i];
    let best = null, bestD = 20;
    for (let i = 0; i < F.nodes.length; i++) {
      const n = F.nodes[i];
      if (!n.card) continue;
      const pt = S(n.lon, n.lat);
      const d = Math.hypot(pt[0] - x, pt[1] - y);
      if (d < bestD) { bestD = d; best = n; }
    }
    return best;
  }

  cv.addEventListener('pointerdown', function (e) {
    dragging = true;
    dragMoved = false;
    hideHint();
    dragStart = { x: e.clientX, y: e.clientY };
    viewAtDrag = { cx: view.cx, cy: view.cy };
    downNode = pointAt(e.clientX, e.clientY);
    cv.classList.add('dragging');
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
  });

  cv.addEventListener('pointermove', function (e) {
    if (dragging) {
      const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
      if (!dragMoved && Math.hypot(dx, dy) > 4) {
        dragMoved = true;
        hideCard(true);
      }
      if (dragMoved) {
        view.cx = viewAtDrag.cx - dx / sc();
        view.cy = viewAtDrag.cy - dy / sc();
        target.cx = view.cx;
        target.cy = view.cy;
      }
      return;
    }
    if (e.pointerType === 'mouse') {
      const n = pointAt(e.clientX, e.clientY);
      if (n !== hoverNode) {
        hoverNode = n;
        cv.classList.toggle('pointing', !!n);
      }
      if (n) showCard(n, e.clientX, e.clientY, false);
      else if (!pinned) hideCard(false);
    }
  });

  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    cv.classList.remove('dragging');
    if (!dragMoved && downNode) {
      showCard(downNode, e.clientX, e.clientY, true);
    }
    downNode = null;
  }

  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', function () {
    dragging = false;
    cv.classList.remove('dragging');
  });
  cv.addEventListener('pointerleave', function () {
    if (!pinned) hideCard(false);
    hoverNode = null;
    cv.classList.remove('pointing');
  });

  cv.addEventListener('wheel', function (e) {
    e.preventDefault();
    hideHint();
    const s0 = sc();
    const pxc = view.cx + (e.clientX - AX) / s0;
    const pyc = view.cy + (e.clientY - AY) / s0;
    const z = clamp(view.z * Math.exp(-e.deltaY * 0.0016), 0.55, 40);
    view.z = z;
    target.z = z;
    const s1 = sc();
    view.cx = pxc - (e.clientX - AX) / s1;
    view.cy = pyc - (e.clientY - AY) / s1;
    target.cx = view.cx;
    target.cy = view.cy;
    hideCard(true);
  }, { passive: false });

  /* 双击复位到当前幕视角 */
  cv.addEventListener('dblclick', function () {
    const F = FRAMES[state.i];
    const v = proj(F.view.lon, F.view.lat);
    target.cx = v[0];
    target.cy = v[1];
    target.z = F.view.z;
  });

  /* ---------- 首次提示 ---------- */
  const hintEl = document.getElementById('hint');
  let hintTimer = null;

  function showHint() {
    hintEl.classList.add('show');
    window.clearTimeout(hintTimer);
    hintTimer = window.setTimeout(hideHint, 9000);
  }

  function hideHint() {
    hintEl.classList.remove('show');
    window.clearTimeout(hintTimer);
  }

  /* ---------- 史实卡 ---------- */
  const cardEl = document.getElementById('card');
  const ctEl = document.getElementById('ct');
  const cdEl = document.getElementById('cd');
  const cxEl = document.getElementById('cx');
  let pinned = false;

  function showCard(n, x, y, pin) {
    if (!n.card) return;
    ctEl.textContent = n.card.t;
    cdEl.textContent = n.card.d || '';
    cxEl.textContent = n.card.x || '';
    cardEl.classList.add('show');
    const w = cardEl.offsetWidth;
    const h = cardEl.offsetHeight;
    let left = x + 18;
    let top = y - h - 16;
    if (left + w > window.innerWidth - 12) left = x - w - 18;
    if (top < 12) top = y + 22;
    if (top + h > window.innerHeight - 12) top = window.innerHeight - h - 12;
    cardEl.style.left = Math.max(12, left) + 'px';
    cardEl.style.top = Math.max(12, top) + 'px';
    pinned = !!pin;
  }

  function hideCard(force) {
    if (pinned && !force) return;
    cardEl.classList.remove('show');
    pinned = false;
  }

  document.addEventListener('pointerdown', function (e) {
    if (!cardEl.contains(e.target) && !cv.contains(e.target) && !tlEl.contains(e.target)) {
      hideCard(true);
    }
  }, true);

  /* ---------- 封面与进入 ---------- */
  const cover = document.getElementById('cover');
  const wipe = document.getElementById('wipe');
  const enterBtn = document.getElementById('enter');

  function enterSite() {
    if (state.entered) return;
    state.entered = true;

    // 起点远一点，让镜头有一次推近
    const F0 = FRAMES[0];
    const v = proj(F0.view.lon, F0.view.lat);
    view.cx = v[0];
    view.cy = v[1];
    view.z = F0.view.z * 0.42;
    target.cx = v[0];
    target.cy = v[1];
    target.z = F0.view.z;

    cover.classList.add('leaving');
    wipe.classList.add('run');
    document.body.classList.add('entered');

    if (window.Music) {
      try { window.Music.start(); } catch (e) { /* ignore */ }
      window.Music.setVolume(Number(document.getElementById('vol').value) / 100);
      window.Music.setMuted(document.body.classList.contains('muted'));
    }

    window.setTimeout(function () {
      cover.style.display = 'none';
      document.body.classList.remove('has-cover');
      showHint();
    }, 1150);
  }

  enterBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    enterSite();
  });
  cover.addEventListener('click', enterSite);

  /* ---------- 音乐控制 ---------- */
  const volInput = document.getElementById('vol');
  const muteBtn = document.getElementById('mute');
  const mico = document.getElementById('mico');
  const wave1 = document.getElementById('wave1');
  const wave2 = document.getElementById('wave2');
  const volBox = document.getElementById('volbox');

  function paintMute() {
    const m = document.body.classList.contains('muted');
    volBox.classList.toggle('muted', m);
    if (m) {
      wave1.style.display = 'none';
      wave2.style.display = 'none';
    } else {
      wave1.style.display = '';
      wave2.style.display = '';
    }
    muteBtn.setAttribute('aria-label', m ? '取消静音' : '静音');
  }

  volInput.addEventListener('input', function () {
    const v = Number(volInput.value) / 100;
    if (window.Music) window.Music.setVolume(v);
    if (Number(volInput.value) > 0 && document.body.classList.contains('muted')) {
      document.body.classList.remove('muted');
      if (window.Music) window.Music.setMuted(false);
      paintMute();
    }
  });

  muteBtn.addEventListener('click', function () {
    const m = !document.body.classList.contains('muted');
    document.body.classList.toggle('muted', m);
    if (window.Music) window.Music.setMuted(m);
    paintMute();
  });
  paintMute();

  /* ---------- 全屏 / 剧场 ---------- */
  const fullBtn = document.getElementById('full');

  function toggleFull() {
    if (!document.fullscreenElement) {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(function () { /* ignore */ });
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else if (document.exitFullscreen) {
      document.exitFullscreen().catch(function () { /* ignore */ });
    }
  }

  fullBtn.addEventListener('click', toggleFull);

  const theaterBtn = document.getElementById('theater');
  let theaterTimer = null;

  function setTheater(on) {
    document.body.classList.toggle('theater', on);
    if (on) revealUI();
  }

  function revealUI() {
    document.body.classList.add('show-ui');
    window.clearTimeout(theaterTimer);
    theaterTimer = window.setTimeout(function () {
      if (document.body.classList.contains('theater')) document.body.classList.remove('show-ui');
    }, 2200);
  }

  theaterBtn.addEventListener('click', function () {
    setTheater(!document.body.classList.contains('theater'));
  });

  window.addEventListener('mousemove', function () {
    if (document.body.classList.contains('theater')) revealUI();
  });

  /* ---------- 键盘 ---------- */
  window.addEventListener('keydown', function (e) {
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;

    hideHint();

    switch (e.key) {
      case ' ':
        e.preventDefault();
        playBtn.click();
        break;
      case 'ArrowRight':
        e.preventDefault();
        goTo(state.i + 1);
        break;
      case 'ArrowLeft':
        e.preventDefault();
        goTo(state.i - 1);
        break;
      case 'Home':
        goTo(0);
        break;
      case 'End':
        goTo(LAST);
        break;
      case 'm':
      case 'M':
        muteBtn.click();
        break;
      case 'f':
      case 'F':
        toggleFull();
        break;
      case 't':
      case 'T':
        setTheater(!document.body.classList.contains('theater'));
        break;
      case 'Escape':
        if (document.body.classList.contains('theater')) setTheater(false);
        break;
      default:
        break;
    }
  });

  /* ---------- 启动 ---------- */
  resize();
  window.addEventListener('resize', function () {
    resize();
    draw();
  });

  (function init() {
    const F0 = FRAMES[0];
    const v = proj(F0.view.lon, F0.view.lat);
    view.cx = v[0];
    view.cy = v[1];
    view.z = F0.view.z;
    target.cx = v[0];
    target.cy = v[1];
    target.z = F0.view.z;
    state.ft = FRAME_LEN;
    paintUI(0);
    paintProgress();
    updatePlayIcon();
  })();

  requestAnimationFrame(loop);

  /* 供自动化测试与调试使用 */
  window.__map = {
    state: state,
    view: view,
    target: target,
    S: S,
    pointAt: pointAt,
    frames: FRAMES
  };
})();

</script>

    <h1>星星之火 · 井冈山道路（1927—1949）</h1>

    <h2><span class="y">序章 1927</span>血色之年</h2>
    <p>大革命失败。八月七日，中共中央在汉口召开紧急会议，确定了土地革命和武装起义的方针。随后，南昌起义、秋收起义、广州起义接连爆发——起义队伍一次次攻打中心城市，也一次次在优势敌人的合围下退却。城市里，敌人太强；可中国太大了，他们的手，伸不到每一个乡村。</p>
    <div class="k">城市中心论 · 接连受挫</div>

    <h2><span class="y">第一幕 1927.10</span>上山</h2>
    <p>秋收起义受挫，部队在浏阳文家市转兵向南，一路退到永新三湾。三湾改编，把支部建在连上，这支队伍脱胎换骨。十月，毛泽东带着不足千人的队伍登上井冈山——罗霄山脉中段，湘赣两省交界，山高林密，正是敌人统治力量最薄弱的地方。</p>

    <h2><span class="y">第二幕 1928.4</span>会师</h2>
    <p>四月，朱德、陈毅率领南昌起义余部和湘南农军上山，与毛泽东部会师，中国工农红军第四军成立。井冈山进入全盛时期，边界武装割据扩大到数县。星星之火，第一次显露出燎原的势头。</p>
    <div class="k">朱毛会师 · 红四军成立</div>

    <h2><span class="y">第三幕 1929—1931</span>下山</h2>
    <p>红军主力下井冈山，转战赣南、闽西，中央苏区连成一片。一九三一年十一月，中华苏维埃共和国临时中央政府在瑞金成立。鄂豫皖、湘鄂西、闽浙赣、左右江、陕甘、琼崖……十几块根据地在中国的山野间同时燃起。</p>
    <div class="k">中央苏区 · 星火成片</div>

    <h2><span class="y">第四幕 1934—1936</span>长征</h2>
    <p>第五次反「围剿」失利，中央红军被迫战略转移。一九三五年一月遵义会议，纠正了错误的军事领导。四渡赤水、巧渡金沙江、强渡大渡河、飞夺泸定桥，翻过雪山，走过草地。一九三五年十月，中央红军到达陕北吴起镇。革命的大本营，落在了西北。</p>
    <div class="k">遵义会议 · 战略转移</div>

    <h2><span class="y">第五幕 1937—1945</span>敌后</h2>
    <p>全面抗战爆发，红军改编为八路军、新四军，挺进敌后。晋察冀、晋绥、晋冀鲁豫、山东、华中的根据地，一块块在敌人后方建立起来。正面战场在退，敌后却在进——农村根据地，成了持久抗战最深的根基。</p>
    <div class="k">敌后抗日根据地</div>

    <h2><span class="y">第六幕 1946—1949</span>夺取城市</h2>
    <p>解放战争转入战略反攻。辽沈、淮海、平津三大战役，国民党军队主力被歼。百万雄师过大江，南京、上海、武汉相继解放。农村包围城市，最后夺取城市——二十二年，这条路走到了终点。</p>
    <div class="k">三大战役 · 渡江战役</div>

    <h2><span class="y">尾声 1949.10.1</span>燎原</h2>
    <p>为什么这条路走得通？因为中国是半殖民地半封建社会，政治经济发展极不平衡：敌人统治的重心在城市，广大农村是他们的薄弱环节；而农民，占了中国人口的绝大多数。星火之所以能够燎原，是因为它落在了干柴之上。</p>
    <div class="k">农村包围城市 · 武装夺取政权</div>
